<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 810" width="2400" height="810" role="presentation">
<defs>
  <!-- The first stop is nearly the page's own paper. The band butts straight
       up against the #f4f3f3 link grid, and starting the sky on full cool blue
       put a hard colour seam along that join. -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eff1f2"/>
    <stop offset="0.17" stop-color="#dde5f0"/>
    <stop offset="0.4" stop-color="#ecedea"/>
    <stop offset="0.66" stop-color="#f8e9cf"/>
    <stop offset="0.9" stop-color="#fcdfae"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="rgba(252,213,146,0.88)"/>
    <stop offset="0.34" stop-color="rgba(250,206,138,0.32)"/>
    <stop offset="1" stop-color="rgba(250,206,138,0)"/>
  </radialGradient>
  <linearGradient id="m1g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#aab5ca"/>
    <stop offset="1" stop-color="#c0c9d8"/>
  </linearGradient>
  <linearGradient id="m2g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8190ac"/>
    <stop offset="1" stop-color="#97a4bd"/>
  </linearGradient>
  <!-- Shade faces die out well above the base: a flat fill leaves a hard
       horizontal cut across the range where the wedge ends. -->
  <linearGradient id="sh1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9caac1"/>
    <stop offset="0.55" stop-color="#9caac1" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#9caac1" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sh2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#74839e"/>
    <stop offset="0.5" stop-color="#74839e" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#74839e" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="haze1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="rgba(251,235,209,0)"/>
    <stop offset="1" stop-color="rgba(251,235,209,0.72)"/>
  </linearGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5f6b79" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#5f6b79" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clipR1"><path d="M-90,283L-57,270L-17,226L9,297L147,352L276,346L309,310L360,360L483,356L601,376L642,332L666,360L773,436L830,412L887,400L923,411L1000,426L1098,391L1129,373L1185,389L1269,439L1415,411L1466,393L1519,410L1571,448L1646,400L1709,377L1751,406L1886,409L1998,345L2054,318L2103,343L2170,361L2276,266L2323,207L2365,285L2490,246L2490,540L-90,540Z"/></clipPath>
  <clipPath id="clipR2"><path d="M-90,411L-52,401L-9,374L26,413L146,445L224,437L270,408L292,434L325,453L362,457L398,435L423,448L523,481L630,474L666,461L702,474L800,525L852,491L891,481L917,488L1002,527L1097,481L1126,474L1157,480L1215,496L1290,477L1327,466L1358,478L1409,499L1435,459L1476,441L1512,466L1595,459L1713,452L1744,423L1782,439L1820,465L1889,405L1936,358L1975,389L2063,413L2152,398L2192,368L2228,398L2276,396L2327,388L2376,338L2418,388L2490,378L2490,580L-90,580Z"/></clipPath>
  <filter id="wobFar" filterUnits="userSpaceOnUse" x="-100" y="110" width="2600" height="820" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="2" seed="3" result="t"/>
<feDisplacementMap in="SourceGraphic" in2="t" scale="10" xChannelSelector="R" yChannelSelector="G"/>
</filter>
  <filter id="soften" filterUnits="userSpaceOnUse" x="-100" y="0" width="2600" height="810" color-interpolation-filters="sRGB">
<feGaussianBlur stdDeviation="7"/>
</filter>
  
<filter id="grainF" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<pattern id="grain" width="200" height="200" patternUnits="userSpaceOnUse">
  <rect width="200" height="200" filter="url(#grainF)"/>
</pattern>
</defs>

